
name: winter-auth

services:
  postgres:
    image: postgres:17-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth_dev_password
      POSTGRES_DB: auth
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: auth-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "auth_redis_dev_password", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "auth_redis_dev_password", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth_pg_data:
  auth_redis_data:
